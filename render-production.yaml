services:
  - type: web
    name: cps-agent-system
    runtime: python
    region: singapore
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cps-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: BUSINESS_TIMEZONE
        value: Asia/Shanghai
      - key: PAYMENT_CALLBACK_SECRET
        sync: false
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: PYTHON_VERSION
        value: 3.12.8

databases:
  - name: cps-postgres
    region: singapore
    plan: basic-256mb
    diskSizeGB: 15
    storageAutoscalingEnabled: true
    postgresMajorVersion: "18"
    ipAllowList: []
