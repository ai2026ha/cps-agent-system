<!doctype html>
<html lang="zh-CN">
<head>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CPS 智能代理系统</title>
  <link rel="stylesheet" href="/static/styles.css?v=v82-brand-title-stable" />
</head>
<body>
<!-- V8: self-contained line icons for the primary navigation. No external CDN required. -->

  <symbol id="icon-channel" viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.4"/><circle cx="6" cy="18" r="2.4"/><circle cx="18" cy="18" r="2.4"/><path d="M12 7.4v6.1M6 15.6v-2.1h12v2.1"/></symbol>
  <symbol id="icon-player" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></symbol>
  <symbol id="icon-order" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3Z"/><path d="M9 8h6M9 12h6M9 16h4"/></symbol>
  <symbol id="icon-product" viewBox="0 0 24 24"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"/><path d="m4.4 7.7 7.6 4.2 7.6-4.2M12 12v9"/></symbol>

  <symbol id="icon-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4.5 7 7.5 6 7.5-6"/></symbol>
  <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.09A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.09A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.09A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.12.38.33.73.6 1 .3.28.7.43 1.1.4H21v4h-.09a1.7 1.7 0 0 0-1.51.6Z"/></symbol>

<div id="login" class="login-page hidden">
  <div class="login-card">
    <div class="brand-mark">CPS</div>
    <h1>智能代理系统</h1>
    <p>渠道、玩家、订单与运营一体化管理</p>
    <form id="loginForm" autocomplete="off">
      <label>登录账号</label><input id="loginUser" autocomplete="off" placeholder="请输入登录账号" />
      <label>登录密码</label><input id="loginPass" type="password" autocomplete="new-password" placeholder="请输入登录密码" />
      <button type="submit">登录系统</button>
      <div id="loginError" class="error"></div>
      <div class="build-marker">V82 · BRAND TITLE FIX</div>
    </form>
  </div>
</div>
<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand" id="sidebarBrand">
      <span class="brand-edge" aria-hidden="true"></span>
      <span class="brand-logo" id="sidebarBrandLogo" aria-hidden="true"></span>
      <span class="brand-name" id="sidebarBrandName">CPS</span>
    </div>
    <nav id="nav" class="nav-tree">
      <button type="button" data-view="dashboard" class="nav-dashboard active" data-permission="dashboard.view">
        <svg class="nav-menu-icon" aria-hidden="true"><use href="#icon-dashboard"></use></svg><span>数据总览</span>
      </button>

      <section class="nav-section" data-section="channels" data-permission="channels.view">
        <button type="button" class="nav-parent" aria-expanded="false">
          <span class="nav-parent-main"><svg class="nav-menu-icon" aria-hidden="true"><use href="#icon-channel"></use></svg><span>渠道管理</span></span><span class="nav-chevron">›</span>
        </button>
        <div class="nav-children">
          <button type="button" class="nav-child" data-view="agents" data-permission="channels.view">下级渠道</button>
          <button type="button" class="nav-child" data-view="settlements" data-permission="settlements.view">渠道结算</button>
        </div>
      </section>

      <section class="nav-section" data-section="players" data-permission="players.view">
        <button type="button" class="nav-parent" aria-expanded="false">
          <span class="nav-parent-main"><svg class="nav-menu-icon" aria-hidden="true"><use href="#icon-player"></use></svg><span>玩家管理</span></span><span class="nav-chevron">›</span>
        </button>
        <div class="nav-children">
          <button type="button" class="nav-child" data-view="players" data-permission="players.view">玩家列表</button>
          <button type="button" class="nav-child" data-view="playerBehaviorTest" data-permission="payment.test">玩家行为测试</button>
        </div>
      </section>

      <section class="nav-section" data-section="orders" data-permission="orders.view">
        <button type="button" class="nav-parent" aria-expanded="false">
          <span class="nav-parent-main"><svg class="nav-menu-icon" aria-hidden="true"><use href="#icon-order"></use></svg><span>订单管理</span></span><span class="nav-chevron">›</span>
        </button>
        <div class="nav-children">
          <button type="button" class="nav-child" data-view="platformOrders" data-permission="orders.view">平台币订单</button>
          <button type="button" class="nav-child" data-view="paymentTest" data-permission="payment.test">支付测试</button>
          <button type="button" class="nav-child" data-view="mallOrders" data-permission="orders.view">商城订单</button>
          <button type="button" class="nav-child" data-view="shipments" data-permission="shipments.view">发货查询</button>
        </div>
      </section>

      <section class="nav-section" data-section="products" data-permission="products.view">
        <button type="button" class="nav-parent" aria-expanded="false">
          <span class="nav-parent-main"><svg class="nav-menu-icon" aria-hidden="true"><use href="#icon-product"></use></svg><span>商品管理</span></span><span class="nav-chevron">›</span>
        </button>
        <div class="nav-children">
          <button type="button" class="nav-child" data-view="gifts" data-permission="products.view">礼包列表</button>
          <button type="button" class="nav-child" data-view="products" data-permission="products.view">商品列表</button>
          <button type="button" class="nav-child" data-view="privilegeCards" data-permission="privilege.manage">特权卡配置</button>
        </div>
      </section>

      <section class="nav-section" data-section="cdk" data-permission="cdk.view">
        <button type="button" class="nav-parent" aria-expanded="false">
          <span class="nav-parent-main"><svg class="nav-menu-icon" aria-hidden="true"><use href="#icon-cdk"></use></svg><span>兑换码管理</span></span><span class="nav-chevron">›</span>
        </button>
        <div class="nav-children">
          <button type="button" class="nav-child" data-view="cdk" data-permission="cdk.view">兑换码列表</button>
        </div>
      </section>

      <section class="nav-section" data-section="recharge" data-permission="recharge.view">
        <button type="button" class="nav-parent" aria-expanded="false">
          <span class="nav-parent-main"><svg class="nav-menu-icon" aria-hidden="true"><use href="#icon-recharge"></use></svg><span>累充管理</span></span><span class="nav-chevron">›</span>
        </button>
        <div class="nav-children">
          <button type="button" class="nav-child" data-view="rechargeRules" data-permission="recharge.view">累充列表</button>
          <button type="button" class="nav-child" data-view="claims" data-permission="claims.view">领取记录</button>
        </div>
      </section>

      <section class="nav-section" data-section="mail" data-permission="mail.view">
        <button type="button" class="nav-parent" aria-expanded="false">
          <span class="nav-parent-main"><svg class="nav-menu-icon" aria-hidden="true"><use href="#icon-mail"></use></svg><span>邮件管理</span></span><span class="nav-chevron">›</span>
        </button>
        <div class="nav-children">
          <button type="button" class="nav-child" data-view="sendMail" data-permission="mail.send">发送邮件</button>
          <button type="button" class="nav-child" data-view="mailRecords" data-permission="mail.view">发送记录</button>
        </div>
      </section>

      <section class="nav-section" data-section="system" data-permission="system.settings">
        <button type="button" class="nav-parent" aria-expanded="false">
          <span class="nav-parent-main"><svg class="nav-menu-icon" aria-hidden="true"><use href="#icon-settings"></use></svg><span>系统设置</span></span><span class="nav-chevron">›</span>
        </button>
        <div class="nav-children">
          <button type="button" class="nav-child" data-view="profileSettings" data-permission="system.settings">个人信息</button>
          <button type="button" class="nav-child" data-view="adminManagers" data-permission="system.admins.manage">管理员</button>
          <button type="button" class="nav-child" data-view="systemEditor" data-permission="system.branding.manage">系统编辑</button>
          <button type="button" class="nav-child" data-view="ipWhitelist" data-permission="system.ip_access.manage">白名单</button>
        </div>
      </section>
    </nav>
  </aside>
  <main>
    <header><div><h2 id="pageTitle">数据总览</h2><p id="pageSub">CPS 运营核心指标</p></div><div class="header-actions"><div id="identityBadge" class="identity-badge"><strong>admin</strong><span>超级管理员</span></div><button class="ghost" id="refreshBtn">刷新</button><button class="danger ghost" id="logoutBtn">退出</button></div></header>
    <section id="content"></section>
  </main>
</div>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h3 id="modalTitle">新增</h3><button id="closeModal">×</button></div><form id="modalForm"></form></div></div>
<script src="/static/app.js?v=v82-brand-title-stable"></script>
</body>
</html>
