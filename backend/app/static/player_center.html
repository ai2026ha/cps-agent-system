  <!-- V87: 玩家中心取消品牌图标、名称放大、登录按钮恢复原深蓝色 -->
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#1b2740;background:#edf2f8}body{display:flex;justify-content:center}button,input,select{font:inherit}.hidden{display:none!important}.shell{width:100%;max-width:480px;min-height:100vh;background:#f4f7fb;box-shadow:0 0 0 1px rgba(31,50,82,.03)}

    .center{width:100%;padding:14px 12px calc(24px + env(safe-area-inset-bottom))}.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.topbar-brand{display:flex;align-items:center;min-width:0}.topbar-brand>div:last-child{min-width:0}.topbar h2{font-size:20px;line-height:1.25;margin:0}.topbar p{margin:3px 0 0;color:#8995a8;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}.top-actions{display:flex;gap:6px;flex:0 0 auto}.ghost{min-width:52px;height:38px;padding:0 9px;border-radius:9px;border:1px solid #dce3ed;background:#fff;color:#4f5d73;cursor:pointer;font-size:12px}
    .overview{display:block;margin-bottom:10px}.stat{min-width:0;background:#fff;border:1px solid #e1e7ef;border-radius:12px;padding:12px}.stat.account-balance{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px}.account-block,.balance-block{min-width:0}.balance-block{text-align:right}.stat span{display:block;color:#8792a5;font-size:11px;margin-bottom:5px}.stat strong{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.account-block strong{font-size:17px}.balance-block strong{font-size:24px;color:#c77711}
    .tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin:0 0 10px;position:sticky;top:0;z-index:8;padding:6px 0;background:#f4f7fb}.tab{min-width:0;border:1px solid #dce3ed;background:#fff;color:#59667a;height:44px;padding:0 2px;border-radius:10px;cursor:pointer;font-size:11px;font-weight:700;line-height:1.15}.tab.active{background:#1e3a70;color:#fff;border-color:#1e3a70}
    .panel{background:#fff;border:1px solid #e1e7ef;border-radius:14px;padding:14px 12px}.feature-panel{min-height:260px}.panel-head{display:flex;flex-direction:column;gap:10px;margin-bottom:13px}.panel-head h3{margin:0 0 3px;font-size:17px}.panel-head p{margin:0;color:#8a96a8;font-size:12px;line-height:1.55}.character-picker{width:100%;min-width:0}.character-picker label{margin:0 0 6px}.character-picker select,.gift-select{width:100%;height:46px;border:1px solid #d8e0ec;border-radius:10px;background:#fff;padding:0 10px;color:#26344e;outline:none}.mall-purchase{width:100%;max-width:none}.gift-select-wrap{margin-bottom:12px}.gift-select-wrap label{margin:0 0 7px}.gift-detail{border:1px solid #e1e7ef;border-radius:13px;padding:14px 12px;background:#fbfcfe}.gift-content{margin-bottom:12px}.gift-content-label{font-size:12px;font-weight:700;color:#5f6e84;margin-bottom:8px}.gift-items{display:grid;gap:8px}.gift-item{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;min-height:42px;padding:9px 10px;border:1px solid #e5eaf1;border-radius:10px;background:#fff}.gift-item-name{min-width:0;font-size:13px;color:#31405a;word-break:break-word}.gift-item-qty{font-size:13px;font-weight:800;color:#253a61;white-space:nowrap}.gift-item-raw{font-size:13px;color:#66758c;line-height:1.65;word-break:break-word}.buy-area{width:100%}.buy-btn{width:100%;min-height:48px;border:0;border-radius:11px;background:#1e3a70;color:#fff;padding:10px 14px;font-weight:800;cursor:pointer;font-size:14px;line-height:1.25}.empty{padding:34px 12px;text-align:center;color:#94a0b1;font-size:13px}
    .feature-placeholder{display:flex;flex-direction:column;gap:7px;width:100%;border:1px dashed #d7dfeb;background:#fafbfd;border-radius:12px;padding:18px 14px;color:#617087}.feature-placeholder strong{font-size:15px;color:#26344e}.feature-placeholder span{font-size:12px;line-height:1.65}.section-divider{height:1px;background:#e8ecf2;margin:18px 0 15px}.compact-head{margin-bottom:9px}.cumulative-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.cumulative-stat{border:1px solid #e1e7ef;border-radius:12px;background:#fbfcfe;padding:12px 10px;text-align:center}.cumulative-stat span{display:block;font-size:12px;color:#748198;margin-bottom:5px}.cumulative-stat strong{display:block;font-size:20px;line-height:1.2;color:#1e3a70;font-variant-numeric:tabular-nums}.cumulative-stat small{display:block;margin-top:3px;font-size:10px;color:#98a2b3}.reward-select-wrap{margin-bottom:12px}.reward-select-wrap label{margin:0 0 7px}.reward-select{width:100%;height:46px;border:1px solid #d8e0ec;border-radius:10px;background:#fff;padding:0 10px;color:#26344e;outline:none}.reward-detail{border:1px solid #e1e7ef;border-radius:13px;padding:14px 12px;background:#fbfcfe}.reward-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;font-size:12px;color:#748198}.reward-meta strong{color:#31405a;font-size:13px}.reward-content-label{font-size:12px;font-weight:700;color:#5f6e84;margin-bottom:8px}.reward-action{width:100%;min-height:46px;margin-top:12px;border:0;border-radius:10px;background:#1e3a70;color:#fff;font-weight:800;cursor:pointer}.reward-action:disabled{background:#e3e7ed;color:#8994a5;cursor:not-allowed}.cdk-form{display:grid;gap:10px}.cdk-form label{margin:0}.cdk-input{width:100%;text-transform:uppercase;letter-spacing:.4px}.cdk-btn{width:100%}.cdk-result{min-height:18px;font-size:12px;line-height:1.6;color:#5f6e84}.cdk-result.ok{padding:11px 12px;border-radius:10px;background:#edf7f2;border:1px solid #cfeadf;color:#167a57}
    .privilege-area{margin-top:12px}.privilege-card-detail{border:1px solid #e1e7ef;border-radius:13px;padding:14px 12px;background:#fbfcfe}.privilege-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.privilege-meta div{padding:9px 10px;border:1px solid #e5eaf1;border-radius:10px;background:#fff}.privilege-meta span{display:block;font-size:10px;color:#8a96a8;margin-bottom:3px}.privilege-meta strong{font-size:13px;color:#31405a}.privilege-list{display:grid;gap:9px;margin-top:10px}.privilege-owned{border:1px solid #e1e7ef;border-radius:12px;background:#fbfcfe;padding:12px}.privilege-owned-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.privilege-owned-head strong{font-size:14px}.privilege-owned-head span{font-size:11px;color:#7f8ba0}.privilege-owned-dates{font-size:11px;color:#7f8ba0;margin:7px 0 9px}.privilege-claim{width:100%;height:42px;border:0;border-radius:9px;background:#1e3a70;color:#fff;font-weight:800}.privilege-claim:disabled{background:#e3e7ed;color:#8994a5}.privilege-status{display:inline-flex;padding:3px 7px;border-radius:999px;font-size:10px;background:#edf2f7;color:#657188}.privilege-status.active{background:#e8f7f0;color:#167554}.privilege-status.waiting{background:#fff4df;color:#98600c}.privilege-status.expired{background:#fdebec;color:#b53545}
    .order-list{display:grid;gap:9px}.order-card{border:1px solid #e3e8f0;border-radius:12px;background:#fbfcfe;padding:12px}.order-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding-bottom:9px;margin-bottom:8px;border-bottom:1px solid #e9edf3}.order-card-head strong{font-size:13px;word-break:break-all}.order-card-head span{font-size:11px;color:#909caf;white-space:nowrap}.order-row{display:grid;grid-template-columns:72px minmax(0,1fr);gap:7px;padding:4px 0;font-size:12px;line-height:1.5}.order-row .k{color:#8b96a8}.order-row .v{color:#31405a;word-break:break-word;text-align:right}.badge{display:inline-flex;align-items:center;min-height:23px;padding:2px 8px;border-radius:999px;background:#f0f3f7;color:#647086;font-size:11px}.badge.ok{background:#e8f7f0;color:#167554}.badge.warn{background:#fff4df;color:#98600c}.badge.bad{background:#fdebec;color:#b53545}
    .toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;width:calc(100% - 32px);max-width:430px;background:#1d2a42;color:#fff;border-radius:11px;padding:12px 14px;box-shadow:0 12px 32px rgba(24,38,64,.2);font-size:13px;text-align:center}.loading{opacity:.6;pointer-events:none}
  </style>
</head>
<body>
<div class="shell">
  <section id="loginView" class="login-wrap hidden">
    <main class="login-card">
      <div class="brand"><div class="brand-copy"><strong id="loginCenterName">玩家中心</strong><small>玩家服务中心</small></div></div>
      <div id="registeredNotice" class="notice hidden">注册成功，请使用刚刚创建的玩家账号登录。</div>
            <form id="loginForm" autocomplete="off">
        <label>玩家账号</label><input id="loginUser" autocomplete="username" required placeholder="请输入玩家账号">
        <label>登录密码</label><input id="loginPass" type="password" autocomplete="current-password" required placeholder="请输入登录密码">
        <button id="loginBtn" class="primary" type="submit">登录玩家中心</button>
      </form>
      <div id="loginMsg" class="msg"></div>
    </main>
  </section>

  <section id="centerView" class="center hidden">
    <header class="topbar">
      <div class="topbar-brand"><div><h2 id="topbarCenterName">玩家中心</h2><p>平台币充值 · 购买礼包 · 领取累充 · 特权卡 · CDK兑换</p></div></div>
      <div class="top-actions"><button id="refreshBtn" class="ghost">刷新</button><button id="logoutBtn" class="ghost">退出登录</button></div>
    </header>
    <div id="overview" class="overview"></div>
    <nav class="tabs feature-tabs">
      <button class="tab active" data-tab="recharge">平台币充值</button>
      <button class="tab" data-tab="mall">购买礼包</button>
      <button class="tab" data-tab="cumulative">领取累充</button>
      <button class="tab" data-tab="privilege">特权卡</button>
      <button class="tab" data-tab="cdk">CDK兑换</button>
    </nav>
    <section id="rechargePanel" class="panel feature-panel">
      <div class="panel-head"><div><h3>平台币充值</h3><p>当前平台币余额：<strong id="rechargeBalance">0</strong></p></div></div>
      <div class="feature-placeholder"><strong>微信 / 支付宝充值入口</strong><span>正式支付通道接入商户参数后，可在这里直接发起平台币充值。</span></div>
    </section>
    <section id="mallPanel" class="panel feature-panel hidden">
      <div class="panel-head"><div><h3>购买礼包</h3></div></div>
      <div class="character-picker"><label>购买角色 / 区服</label><select id="purchaseCharacter"><option value="">请选择购买角色 / 区服</option></select></div>
      <div class="mall-purchase" style="margin-top:12px"><div class="gift-select-wrap"><label>选择礼包</label><select id="giftSelect" class="gift-select"><option value="">请选择礼包</option></select></div><div id="giftDetail" class="gift-detail hidden"></div><div id="giftEmpty" class="empty hidden">暂无可购买礼包</div></div>
    </section>
    <section id="cumulativePanel" class="panel feature-panel hidden">
      <div class="panel-head"><div><h3>领取累充</h3></div></div>
      <div class="character-picker"><label>领取角色 / 区服</label><select id="cumulativeCharacter"><option value="">请选择角色 / 区服</option></select></div>
      <div id="cumulativeRules" style="margin-top:12px"><div class="empty">请先选择角色 / 区服</div></div>
    </section>
    <section id="privilegePanel" class="panel feature-panel hidden">
      <div class="panel-head"><div><h3>特权卡</h3></div></div>
      <div class="character-picker"><label>特权角色 / 区服</label><select id="privilegeCharacter"><option value="">请选择角色 / 区服</option></select></div>
      <div id="privilegeArea" class="privilege-area"><div class="empty">请先选择角色 / 区服</div></div>
    </section>
    <section id="cdkPanel" class="panel feature-panel hidden">
      <div class="panel-head"><div><h3>CDK兑换</h3></div></div>
      <div class="character-picker"><label>兑换角色 / 区服</label><select id="cdkCharacter"><option value="">请选择角色 / 区服</option></select></div>
      <div class="cdk-form" style="margin-top:12px">
        <label for="cdkCode">CDK兑换码</label>
        <input id="cdkCode" class="cdk-input" maxlength="80" autocomplete="off" autocapitalize="characters" placeholder="请输入CDK兑换码">
        <button id="cdkRedeemBtn" class="primary cdk-btn" type="button">立即兑换</button>
        <div id="cdkResult" class="cdk-result"></div>
      </div>
    </section>
  </section>
</div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let token=localStorage.getItem('cps_player_token')||'', me=null, busy=false, selectedPurchaseCharacterId=0, selectedCumulativeCharacterId=0, selectedPrivilegeCharacterId=0, selectedCDKCharacterId=0, mallProducts=[], selectedGiftId=0, selectedRuleId=0, cumulativeData={rules:[]}, privilegeData={cards:[],purchases:[]}, selectedPrivilegeCardId=0;
const params=new URLSearchParams(location.search);
if(params.get('registered')==='1') $('#registeredNotice').classList.remove('hidden');
if(params.get('username')) $('#loginUser').value=params.get('username');
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function errorText(d){if(typeof d==='string')return d;if(Array.isArray(d))return d.map(x=>x.msg||'参数错误').join('；');return d?.message||d?.msg||'请求失败'}
async function api(path,options={}){const headers={'Content-Type':'application/json',...(options.headers||{})};if(token)headers.Authorization=`Bearer ${token}`;const r=await fetch(path,{...options,headers});let d={};try{d=await r.json()}catch{}if(r.status===401&&path!='/api/player/auth/login'){logout(false);throw new Error('登录已失效，请重新登录')}if(!r.ok)throw new Error(errorText(d.detail));return d}
function applyPlayerBranding(data){const name=String(data?.player_center_name||'玩家中心').trim()||'玩家中心';const loginName=$('#loginCenterName'),topbarName=$('#topbarCenterName'),loginBtn=$('#loginBtn');if(loginName)loginName.textContent=name;if(topbarName)topbarName.textContent=name;if(loginBtn)loginBtn.textContent=`登录${name}`;document.title=`${name} · CPS`}
async function loadPlayerBranding(){try{const d=await api('/api/public/system-branding');applyPlayerBranding(d)}catch(_){}}
function toast(text){const old=$('.toast');if(old)old.remove();const el=document.createElement('div');el.className='toast';el.textContent=text;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}
function logout(reload=true){token='';me=null;localStorage.removeItem('cps_player_token');const msg=$('#loginMsg');if(msg){msg.textContent='';msg.classList.remove('success')}$('#centerView').classList.add('hidden');$('#loginView').classList.remove('hidden');if(reload)location.replace('/player')}
function deliveryText(v){return ({waiting:'待发货',sent:'已发货',success:'成功',failed:'失败'})[v]||v||'-'}
function deliveryBadge(v){const c=['sent','success'].includes(v)?'ok':v==='failed'?'bad':'warn';return `<span class="badge ${c}">${esc(deliveryText(v))}</span>`}
function renderOverview(){$('#overview').innerHTML=`<div class="stat account-balance"><div class="account-block"><span>玩家账号</span><strong>${esc(me.username)}</strong></div><div class="balance-block"><span>平台币余额</span><strong>${Number(me.platform_coin_balance||0).toLocaleString()}</strong></div></div>`;const rb=$('#rechargeBalance');if(rb)rb.textContent=Number(me.platform_coin_balance||0).toLocaleString()}
function characterOptions(selectedId,placeholder){const chars=me?.characters||[];return `<option value="">${esc(placeholder)}</option>`+chars.map(x=>`<option value="${Number(x.id)}" ${Number(x.id)===Number(selectedId)?'selected':''}>${esc(x.server_name)} · ${esc(x.role_name)}${x.is_primary?'（主角色）':''}</option>`).join('')}
function renderCharacterPickers(){const chars=me?.characters||[], purchase=$('#purchaseCharacter'), cumulative=$('#cumulativeCharacter'), privilege=$('#privilegeCharacter'), cdk=$('#cdkCharacter');if(!chars.length){selectedPurchaseCharacterId=0;selectedCumulativeCharacterId=0;selectedPrivilegeCharacterId=0;selectedCDKCharacterId=0;if(purchase){purchase.innerHTML='<option value="">未绑定角色 / 区服</option>';purchase.disabled=true}if(cumulative){cumulative.innerHTML='<option value="">未绑定角色 / 区服</option>';cumulative.disabled=true}if(privilege){privilege.innerHTML='<option value="">未绑定角色 / 区服</option>';privilege.disabled=true}if(cdk){cdk.innerHTML='<option value="">未绑定角色 / 区服</option>';cdk.disabled=true}cumulativeData={rules:[]};privilegeData={cards:[],purchases:[]};selectedRuleId=0;selectedPrivilegeCardId=0;renderCumulative();renderPrivilege();return}if(!chars.some(x=>Number(x.id)===Number(selectedPurchaseCharacterId)))selectedPurchaseCharacterId=0;if(!chars.some(x=>Number(x.id)===Number(selectedCumulativeCharacterId)))selectedCumulativeCharacterId=0;if(!chars.some(x=>Number(x.id)===Number(selectedPrivilegeCharacterId)))selectedPrivilegeCharacterId=0;if(!chars.some(x=>Number(x.id)===Number(selectedCDKCharacterId)))selectedCDKCharacterId=0;if(purchase){purchase.disabled=false;purchase.innerHTML=characterOptions(selectedPurchaseCharacterId,'请选择购买角色 / 区服');purchase.onchange=e=>{selectedPurchaseCharacterId=Number(e.target.value||0)}}if(cumulative){cumulative.disabled=false;cumulative.innerHTML=characterOptions(selectedCumulativeCharacterId,'请选择角色 / 区服');cumulative.onchange=async e=>{selectedCumulativeCharacterId=Number(e.target.value||0);selectedRuleId=0;cumulativeData={rules:[]};if(!selectedCumulativeCharacterId){renderCumulative();return}try{await loadCumulative()}catch(err){toast(err.message)}}}if(privilege){privilege.disabled=false;privilege.innerHTML=characterOptions(selectedPrivilegeCharacterId,'请选择角色 / 区服');privilege.onchange=async e=>{selectedPrivilegeCharacterId=Number(e.target.value||0);selectedPrivilegeCardId=0;privilegeData={cards:[],purchases:[]};if(!selectedPrivilegeCharacterId){renderPrivilege();return}try{await loadPrivilege()}catch(err){toast(err.message)}}}if(cdk){cdk.disabled=false;cdk.innerHTML=characterOptions(selectedCDKCharacterId,'请选择兑换角色 / 区服');cdk.onchange=e=>{selectedCDKCharacterId=Number(e.target.value||0);const result=$('#cdkResult');if(result){result.className='cdk-result';result.textContent=''}}}}
function giftItemsHtml(description){
  const lines=String(description||'').split(/\r?\n|[；;]/).map(x=>x.trim()).filter(Boolean);
  if(!lines.length)return '<div class="gift-item-raw">暂无礼包内容</div>';
  return lines.map(line=>{
    const m=line.match(/^(.+?)(?:\s*[xX×*]\s*|\s+)(\d+)\s*(?:个|份|枚|颗|件|张|瓶|箱|套|把|本|块|只|次)?$/);
    if(!m)return `<div class="gift-item"><span class="gift-item-name">${esc(line)}</span><span class="gift-item-qty">—</span></div>`;
    return `<div class="gift-item"><span class="gift-item-name">${esc(m[1].trim())}</span><span class="gift-item-qty">× ${Number(m[2]).toLocaleString()}</span></div>`;
  }).join('');
}
function giftBuyButtonText(x){return x.available?`${Number(x.coin_price).toLocaleString()} 平台币 · 立即购买`:'已售罄'}
function renderGiftDetail(){
  const select=$('#giftSelect'), detail=$('#giftDetail'), empty=$('#giftEmpty');
  if(!mallProducts.length){selectedGiftId=0;select.innerHTML='<option value="">暂无可购买礼包</option>';select.disabled=true;detail.classList.add('hidden');empty.classList.remove('hidden');return}
  empty.classList.add('hidden');select.disabled=false;
  if(selectedGiftId&&!mallProducts.some(x=>Number(x.id)===Number(selectedGiftId)))selectedGiftId=0;
  select.innerHTML='<option value="">请选择礼包</option>'+mallProducts.map(x=>`<option value="${Number(x.id)}" ${Number(x.id)===Number(selectedGiftId)?'selected':''}>${esc(x.name)}</option>`).join('');
  const x=mallProducts.find(x=>Number(x.id)===Number(selectedGiftId));
  if(!x){detail.classList.add('hidden');return}
  detail.classList.remove('hidden');
  detail.innerHTML=`<div class="gift-content"><div class="gift-content-label">礼包内容</div><div class="gift-items">${giftItemsHtml(x.description)}</div></div><div class="buy-area"><button id="giftBuyBtn" class="buy-btn" ${x.available?'':'disabled'}>${giftBuyButtonText(x)}</button></div>`;
  const btn=$('#giftBuyBtn');if(btn&&!btn.disabled)btn.onclick=()=>purchase(Number(x.id),btn);
}
async function loadProducts(){
  mallProducts=await api('/api/player/mall/products');
  renderGiftDetail();
  const select=$('#giftSelect');
  select.onchange=e=>{selectedGiftId=Number(e.target.value||0);renderGiftDetail()};
}
function renderCumulative(){const root=$('#cumulativeRules'),rows=cumulativeData.rules||[];if(!selectedCumulativeCharacterId){selectedRuleId=0;root.innerHTML='<div class="empty">请先选择角色 / 区服</div>';return}const stats=`<div class="cumulative-stats"><div class="cumulative-stat"><span>当日累充</span><strong>${Number(cumulativeData.today_recharge||0).toLocaleString()}</strong><small>平台币</small></div><div class="cumulative-stat"><span>永久累充</span><strong>${Number(cumulativeData.total_recharge||0).toLocaleString()}</strong><small>平台币</small></div></div>`;if(!rows.length){selectedRuleId=0;root.innerHTML=stats+'<div class="empty">该角色当前暂无可领取的累充奖励</div>';return}if(selectedRuleId&&!rows.some(x=>Number(x.id)===Number(selectedRuleId)))selectedRuleId=0;root.innerHTML=stats+`<div class="reward-select-wrap"><label>选择可领取奖励</label><select id="rewardSelect" class="reward-select"><option value="">请选择累充奖励</option>${rows.map(x=>`<option value="${Number(x.id)}" ${Number(x.id)===Number(selectedRuleId)?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div id="rewardDetail" class="reward-detail hidden"></div>`;const select=$('#rewardSelect');select.onchange=e=>{selectedRuleId=Number(e.target.value||0);renderRewardDetail()};renderRewardDetail()}
function renderRewardDetail(){const detail=$('#rewardDetail');if(!detail)return;const x=(cumulativeData.rules||[]).find(x=>Number(x.id)===Number(selectedRuleId));if(!x){detail.classList.add('hidden');detail.innerHTML='';return}detail.classList.remove('hidden');detail.innerHTML=`<div class="reward-content-label">奖励内容</div><div class="gift-items">${giftItemsHtml(x.reward_content)}</div><button id="rewardClaimBtn" class="reward-action">立即领取</button>`;const btn=$('#rewardClaimBtn');btn.onclick=()=>claimCumulative(Number(x.id),btn)}
async function loadCumulative(){if(!selectedCumulativeCharacterId){cumulativeData={rules:[]};renderCumulative();return}cumulativeData=await api(`/api/player/cumulative-recharge?character_id=${selectedCumulativeCharacterId}&claimable_only=true`);renderCumulative()}
async function claimCumulative(ruleId,btn){if(busy)return;if(!selectedCumulativeCharacterId)return toast('请先选择角色 / 区服');busy=true;btn.disabled=true;btn.textContent='领取中…';try{const d=await api(`/api/player/cumulative-recharge/${ruleId}/claim?character_id=${selectedCumulativeCharacterId}`,{method:'POST'});toast(d.message||'领取成功');selectedRuleId=0;await loadCumulative()}catch(e){toast(e.message);await loadCumulative().catch(()=>{})}finally{busy=false}}
function privilegeStatusText(v){return ({active:'生效中',waiting:'待生效',expired:'已过期'})[v]||v||'-'}
function renderPrivilege(){const root=$('#privilegeArea');if(!root)return;if(!selectedPrivilegeCharacterId){root.innerHTML='<div class="empty">请先选择角色 / 区服</div>';return}const cards=privilegeData.cards||[], owned=privilegeData.purchases||[];if(selectedPrivilegeCardId&&!cards.some(x=>Number(x.id)===Number(selectedPrivilegeCardId)))selectedPrivilegeCardId=0;let html='';if(cards.length){html+=`<div class="reward-select-wrap"><label>选择特权卡</label><select id="privilegeCardSelect" class="reward-select"><option value="">请选择特权卡</option>${cards.map(x=>`<option value="${Number(x.id)}" ${Number(x.id)===Number(selectedPrivilegeCardId)?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div id="privilegeCardDetail" class="privilege-card-detail hidden"></div>`}else html+='<div class="empty">暂无可购买特权卡</div>';html+='<div class="section-divider"></div><div class="reward-content-label">我的特权卡</div>';if(!owned.length)html+='<div class="empty">当前角色暂无有效或待生效特权卡</div>';else html+=`<div class="privilege-list">${owned.map(x=>`<div class="privilege-owned"><div class="privilege-owned-head"><strong>${esc(x.card_name)}</strong><span class="privilege-status ${esc(x.status)}">${esc(privilegeStatusText(x.status))}</span></div><div class="privilege-owned-dates">${esc(x.start_date)} 至 ${esc(x.end_date)}</div><div class="gift-items">${giftItemsHtml(x.daily_reward_content)}</div><button class="privilege-claim" data-claim-id="${Number(x.id)}" ${x.can_claim_today?'':'disabled'}>${x.today_claimed?'今日已领取':x.status==='waiting'?'尚未生效':x.status==='expired'?'已过期':'领取今日奖励'}</button></div>`).join('')}</div>`;root.innerHTML=html;const select=$('#privilegeCardSelect');if(select)select.onchange=e=>{selectedPrivilegeCardId=Number(e.target.value||0);renderPrivilegeCardDetail()};renderPrivilegeCardDetail();root.querySelectorAll('[data-claim-id]').forEach(btn=>{if(!btn.disabled)btn.onclick=()=>claimPrivilege(Number(btn.dataset.claimId),btn)})}
function renderPrivilegeCardDetail(){const detail=$('#privilegeCardDetail');if(!detail)return;const x=(privilegeData.cards||[]).find(x=>Number(x.id)===Number(selectedPrivilegeCardId));if(!x){detail.classList.add('hidden');detail.innerHTML='';return}detail.classList.remove('hidden');detail.innerHTML=`<div class="privilege-meta"><div><span>有效期</span><strong>${Number(x.duration_days)} 天</strong></div><div><span>类型</span><strong>${esc(x.card_type_name)}</strong></div></div><div class="reward-content-label">每日奖励</div><div class="gift-items">${giftItemsHtml(x.daily_reward_content)}</div><button id="privilegeBuyBtn" class="buy-btn" style="margin-top:12px">${Number(x.price_coins).toLocaleString()} 平台币 · 购买${esc(x.name)}</button>`;$('#privilegeBuyBtn').onclick=()=>purchasePrivilege(Number(x.id),$('#privilegeBuyBtn'))}
async function loadPrivilege(){if(!selectedPrivilegeCharacterId){privilegeData={cards:[],purchases:[]};renderPrivilege();return}privilegeData=await api(`/api/player/privilege?character_id=${selectedPrivilegeCharacterId}`);renderPrivilege()}
async function purchasePrivilege(cardId,btn){if(busy)return;const x=(privilegeData.cards||[]).find(x=>Number(x.id)===Number(cardId));if(!x)return;const role=(me?.characters||[]).find(c=>Number(c.id)===Number(selectedPrivilegeCharacterId));if(!role)return toast('请先选择角色 / 区服');if(!confirm(`确认使用「${role.server_name} · ${role.role_name}」购买「${x.name}」？需要 ${Number(x.price_coins).toLocaleString()} 平台币。`))return;busy=true;btn.disabled=true;try{const d=await api(`/api/player/privilege/${cardId}/purchase`,{method:'POST',body:JSON.stringify({character_id:selectedPrivilegeCharacterId})});me.platform_coin_balance=d.platform_coin_balance;renderOverview();toast(d.message||'特权卡购买成功');selectedPrivilegeCardId=0;await loadPrivilege()}catch(e){toast(e.message)}finally{busy=false}}
async function claimPrivilege(purchaseId,btn){if(busy)return;busy=true;btn.disabled=true;try{const d=await api(`/api/player/privilege/purchases/${purchaseId}/claim`,{method:'POST'});toast(d.message||'领取成功');await loadPrivilege()}catch(e){toast(e.message);await loadPrivilege().catch(()=>{})}finally{busy=false}}
async function loadPlayerProfile(){me=await api('/api/player/me?include_cumulative=false');renderOverview();renderCharacterPickers()}
function activeFeatureTab(){return $('.tab.active')?.dataset.tab||'recharge'}
async function refreshAll(){await loadPlayerProfile();const tab=activeFeatureTab();if(tab==='mall')await loadProducts();if(tab==='cumulative'){if(selectedCumulativeCharacterId)await loadCumulative();else renderCumulative()}if(tab==='privilege'){if(selectedPrivilegeCharacterId)await loadPrivilege();else renderPrivilege()}}
async function purchase(id,btn){if(busy)return;const product=mallProducts.find(x=>Number(x.id)===Number(id));if(!product)return toast('请先选择礼包');const chars=me?.characters||[];if(chars.length&&!selectedPurchaseCharacterId)return toast('请先选择购买角色 / 区服');const role=chars.find(x=>Number(x.id)===Number(selectedPurchaseCharacterId));const roleText=role?`${role.server_name} · ${role.role_name}`:'未绑定角色';if(!confirm(`确认使用「${roleText}」购买 1 份「${product.name}」？需要 ${Number(product.coin_price).toLocaleString()} 平台币。`))return;busy=true;btn.disabled=true;btn.textContent='购买中…';try{const body={quantity:1};if(selectedPurchaseCharacterId)body.character_id=selectedPurchaseCharacterId;const d=await api(`/api/player/mall/purchase/${id}`,{method:'POST',body:JSON.stringify(body)});toast(`${d.message}：${d.order_no}`);await refreshAll()}catch(e){toast(e.message)}finally{busy=false;const current=$('#giftBuyBtn');if(current){const selected=mallProducts.find(x=>Number(x.id)===Number(selectedGiftId));current.disabled=selected?!selected.available:false;current.textContent=selected?giftBuyButtonText(selected):'立即购买'}}}
async function redeemCDK(){if(busy)return;const input=$('#cdkCode'),btn=$('#cdkRedeemBtn'),result=$('#cdkResult');const code=(input?.value||'').trim().toUpperCase();if(!selectedCDKCharacterId)return toast('请先选择兑换角色 / 区服');if(!code)return toast('请输入CDK兑换码');const role=(me?.characters||[]).find(x=>Number(x.id)===Number(selectedCDKCharacterId));busy=true;btn.disabled=true;btn.textContent='兑换中…';result.className='cdk-result';result.textContent='';try{const d=await api('/api/player/cdk/redeem',{method:'POST',body:JSON.stringify({code,character_id:selectedCDKCharacterId})});input.value='';result.className='cdk-result ok';result.textContent=`${d.message}${d.cdk_name?' · '+d.cdk_name:''}${d.server_name&&d.role_name?' · '+d.server_name+' · '+d.role_name:''}`;toast(d.message||'CDK兑换成功')}catch(e){result.textContent=e.message;toast(e.message)}finally{busy=false;btn.disabled=false;btn.textContent='立即兑换'}}
$('#cdkRedeemBtn').onclick=redeemCDK;$('#cdkCode').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();redeemCDK()}});
$('#loginForm').onsubmit=async e=>{e.preventDefault();const btn=$('#loginBtn');const feedback=$('#loginMsg');feedback.textContent='';feedback.classList.remove('success');if(btn)btn.disabled=true;try{const d=await api('/api/player/auth/login',{method:'POST',body:JSON.stringify({username:$('#loginUser').value.trim(),password:$('#loginPass').value})});token=d.access_token;localStorage.setItem('cps_player_token',token);me={player_id:d.player_id,username:d.username,platform_coin_balance:d.platform_coin_balance,characters:d.characters||[]};feedback.textContent='登录成功';feedback.classList.add('success');await new Promise(resolve=>setTimeout(resolve,420));renderOverview();renderCharacterPickers();$('#loginView').classList.add('hidden');$('#centerView').classList.remove('hidden');history.replaceState({},'',location.pathname);}catch(err){feedback.classList.remove('success');feedback.textContent=err.message}finally{if(btn)btn.disabled=false}};
async function enterCenter(){try{await loadPlayerProfile();$('#loginView').classList.add('hidden');$('#centerView').classList.remove('hidden');history.replaceState({},'',location.pathname)}catch(e){logout(false);$('#loginMsg').textContent=e.message}}
$$('.tab').forEach(btn=>btn.onclick=()=>{const tab=btn.dataset.tab;$$('.tab').forEach(x=>x.classList.toggle('active',x===btn));['recharge','mall','cumulative','privilege','cdk'].forEach(name=>$(`#${name}Panel`)?.classList.toggle('hidden',tab!==name));if(tab==='mall')loadProducts().catch(e=>toast(e.message));if(tab==='cumulative'){if(selectedCumulativeCharacterId)loadCumulative().catch(e=>toast(e.message));else renderCumulative()}if(tab==='privilege'){if(selectedPrivilegeCharacterId)loadPrivilege().catch(e=>toast(e.message));else renderPrivilege()}});
$('#logoutBtn').onclick=()=>logout(true);$('#refreshBtn').onclick=()=>refreshAll().then(()=>toast('已刷新')).catch(e=>toast(e.message));
loadPlayerBranding();if(token)enterCenter();else $('#loginView').classList.remove('hidden');
</script>
</body>
