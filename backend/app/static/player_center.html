<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>玩家中心 · CPS</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#1b2740;background:#f4f7fb}button,input,select{font:inherit}.hidden{display:none!important}.shell{min-height:100vh}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(440px,100%);background:#fff;border:1px solid #e2e7ef;border-radius:18px;box-shadow:0 18px 48px rgba(34,52,84,.12);padding:30px}.brand{display:flex;align-items:center;gap:11px;margin-bottom:24px}.logo{width:44px;height:44px;border-radius:12px;background:#1e3a70;color:#fff;display:grid;place-items:center;font-weight:800}.brand strong{font-size:20px}.brand small{display:block;color:#8a96aa;margin-top:2px}.notice{padding:11px 13px;border-radius:10px;background:#edf7f2;color:#167a57;border:1px solid #cfeadf;font-size:13px;margin-bottom:18px}h1{font-size:25px;margin:0 0 7px}.sub{margin:0 0 22px;color:#7a879c;font-size:14px}label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}input{width:100%;height:44px;border:1px solid #d8e0ec;border-radius:10px;padding:0 12px;outline:none;background:#fff}input:focus{border-color:#5c86e8;box-shadow:0 0 0 3px rgba(92,134,232,.12)}.primary{border:0;background:#1e3a70;color:#fff;border-radius:10px;height:44px;font-weight:700;cursor:pointer}.login-card .primary{width:100%;margin-top:22px}.primary:disabled,.buy-btn:disabled{opacity:.55;cursor:not-allowed}.msg{min-height:20px;margin-top:12px;font-size:13px;color:#c43c4c}.center{max-width:1280px;margin:0 auto;padding:24px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}.topbar-brand{display:flex;align-items:center;gap:10px}.topbar-brand .logo{width:38px;height:38px}.topbar h2{font-size:20px;margin:0}.topbar p{margin:3px 0 0;color:#8995a8;font-size:12px}.top-actions{display:flex;gap:8px}.ghost{height:36px;padding:0 14px;border-radius:9px;border:1px solid #dce3ed;background:#fff;color:#4f5d73;cursor:pointer}.overview{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:12px;margin-bottom:18px}.stat{background:#fff;border:1px solid #e1e7ef;border-radius:13px;padding:15px 16px}.stat span{display:block;color:#8792a5;font-size:12px;margin-bottom:7px}.stat strong{font-size:19px}.coin strong{color:#c77711}.tabs{display:flex;gap:7px;margin:0 0 12px}.tab{border:1px solid #dce3ed;background:#fff;color:#59667a;height:38px;padding:0 17px;border-radius:9px;cursor:pointer}.tab.active{background:#1e3a70;color:#fff;border-color:#1e3a70}.panel{background:#fff;border:1px solid #e1e7ef;border-radius:14px;padding:18px}.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:15px}.panel-head h3{margin:0 0 4px;font-size:17px}.panel-head p{margin:0;color:#8a96a8;font-size:12px}.character-picker{min-width:250px}.character-picker label{margin:0 0 6px}.character-picker select{width:100%;height:38px;border:1px solid #d8e0ec;border-radius:9px;background:#fff;padding:0 10px;color:#26344e;outline:none}.character-picker select:focus{border-color:#5c86e8;box-shadow:0 0 0 3px rgba(92,134,232,.12)}.mall-purchase{max-width:760px}.gift-select-wrap{margin-bottom:14px}.gift-select-wrap label{margin:0 0 7px}.gift-select{width:min(430px,100%);height:42px;border:1px solid #d8e0ec;border-radius:9px;background:#fff;padding:0 10px;color:#26344e;outline:none}.gift-select:focus{border-color:#5c86e8;box-shadow:0 0 0 3px rgba(92,134,232,.12)}.gift-detail{border:1px solid #e1e7ef;border-radius:13px;padding:17px;background:#fbfcfe}.gift-detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:14px}.gift-detail h4{font-size:18px;margin:0 0 5px}.gift-sku{font-size:11px;color:#9aa5b6}.gift-price{text-align:right;font-size:12px;color:#8b95a6;white-space:nowrap}.gift-price strong{display:block;color:#c77711;font-size:21px;margin-top:2px}.gift-content{border-top:1px solid #e7ebf1;border-bottom:1px solid #e7ebf1;padding:13px 0;margin-bottom:14px}.gift-content-label{font-size:12px;font-weight:700;color:#5f6e84;margin-bottom:6px}.gift-content-text{font-size:13px;color:#66758c;line-height:1.65;white-space:pre-wrap;word-break:break-word}.gift-meta{display:flex;align-items:center;justify-content:space-between;gap:12px}.stock{font-size:12px;color:#929daf}.buy-area{display:flex;align-items:center;gap:7px}.qty{width:68px;height:36px;padding:0 8px;border-radius:8px}.buy-btn{height:36px;border:0;border-radius:8px;background:#1e3a70;color:#fff;padding:0 16px;font-weight:700;cursor:pointer}.empty{padding:42px 20px;text-align:center;color:#94a0b1}.table-wrap{overflow:auto;border:1px solid #e7ebf1;border-radius:10px}table{width:100%;border-collapse:collapse;min-width:820px}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid #edf0f4;font-size:13px;white-space:nowrap}th{background:#f7f9fc;color:#657289;font-weight:700}tbody tr:last-child td{border-bottom:0}.badge{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:999px;background:#f0f3f7;color:#647086;font-size:12px}.badge.ok{background:#e8f7f0;color:#167554}.badge.warn{background:#fff4df;color:#98600c}.badge.bad{background:#fdebec;color:#b53545}.toast{position:fixed;right:22px;top:22px;z-index:20;background:#1d2a42;color:#fff;border-radius:10px;padding:11px 14px;box-shadow:0 12px 32px rgba(24,38,64,.2);font-size:13px}.loading{opacity:.6;pointer-events:none}.feature-tabs{flex-wrap:wrap}.feature-panel{min-height:230px}.feature-placeholder{display:flex;flex-direction:column;gap:7px;max-width:720px;border:1px dashed #d7dfeb;background:#fafbfd;border-radius:12px;padding:22px;color:#617087}.feature-placeholder strong{font-size:16px;color:#26344e}.feature-placeholder span{font-size:13px;line-height:1.6}.section-divider{height:1px;background:#e8ecf2;margin:22px 0 18px}.compact-head{margin-bottom:10px}.cumulative-total{font-size:13px;color:#7d899b}.cumulative-total strong{font-size:22px;color:#c77711;margin-left:6px}.reward-list{display:grid;gap:10px}.reward-card{display:grid;grid-template-columns:minmax(160px,1fr) minmax(180px,1.5fr) auto;align-items:center;gap:16px;padding:14px 15px;border:1px solid #e2e7ef;border-radius:11px;background:#fbfcfe}.reward-name strong{display:block;font-size:14px;margin-bottom:4px}.reward-name span,.reward-content{font-size:12px;color:#7d899c}.reward-action{min-width:88px;height:34px;border:0;border-radius:8px;background:#1e3a70;color:#fff;font-weight:700;cursor:pointer}.reward-action:disabled{background:#e3e7ed;color:#8994a5;cursor:not-allowed}@media(max-width:700px){.reward-card{grid-template-columns:1fr}.reward-action{width:100%}}@media(max-width:900px){.overview{grid-template-columns:1fr 1fr}}@media(max-width:620px){.center{padding:14px}.overview{grid-template-columns:1fr}.topbar{align-items:flex-start}.top-actions{flex-direction:column}.panel{padding:13px}.panel-head{flex-direction:column}.character-picker{width:100%;min-width:0}.gift-detail-head,.gift-meta{align-items:flex-start;flex-direction:column}.gift-price{text-align:left}.buy-area{width:100%}.buy-btn{flex:1}}
  </style>
</head>
<body>
<div class="shell">
  <section id="loginView" class="login-wrap">
    <main class="login-card">
      <div class="brand"><div class="logo">CPS</div><div><strong>玩家中心</strong><small>玩家服务中心</small></div></div>
      <div id="registeredNotice" class="notice hidden">注册成功，请使用刚刚创建的玩家账号登录。</div>
      <h1>玩家登录</h1><p class="sub">账号与注册时填写的玩家账号一致。</p>
      <form id="loginForm" autocomplete="off">
        <label>玩家账号</label><input id="loginUser" autocomplete="username" required placeholder="请输入玩家账号">
        <label>登录密码</label><input id="loginPass" type="password" autocomplete="current-password" required placeholder="请输入登录密码">
        <button id="loginBtn" class="primary" type="submit">登录玩家中心</button>
      </form>
      <div id="loginMsg" class="msg"></div>
    </main>
  </section>

  <section id="centerView" class="center hidden">
    <header class="topbar">
      <div class="topbar-brand"><div class="logo">CPS</div><div><h2>玩家中心</h2><p>平台币充值 · 购买礼包 · 领取累充 · 特权卡</p></div></div>
      <div class="top-actions"><button id="refreshBtn" class="ghost">刷新</button><button id="logoutBtn" class="ghost">退出登录</button></div>
    </header>
    <div id="overview" class="overview"></div>
    <nav class="tabs feature-tabs">
      <button class="tab active" data-tab="recharge">平台币充值</button>
      <button class="tab" data-tab="mall">购买礼包</button>
      <button class="tab" data-tab="cumulative">领取累充</button>
      <button class="tab" data-tab="privilege">特权卡</button>
    </nav>
    <section id="rechargePanel" class="panel feature-panel">
      <div class="panel-head"><div><h3>平台币充值</h3><p>当前平台币余额：<strong id="rechargeBalance">0</strong></p></div></div>
      <div class="feature-placeholder"><strong>微信 / 支付宝充值入口</strong><span>正式支付通道接入商户参数后，可在这里直接发起平台币充值。</span></div>
    </section>
    <section id="mallPanel" class="panel feature-panel hidden">
      <div class="panel-head"><div><h3>购买礼包</h3></div><div class="character-picker"><label>购买角色</label><select id="purchaseCharacter"></select></div></div>
      <div class="mall-purchase"><div class="gift-select-wrap"><label>选择礼包</label><select id="giftSelect" class="gift-select"><option value="">请选择礼包</option></select></div><div id="giftDetail" class="gift-detail hidden"></div><div id="giftEmpty" class="empty hidden">暂无可购买礼包</div></div>
      <div class="section-divider"></div>
      <div class="panel-head compact-head"><div><h3>我的商城订单</h3></div></div><div id="orders"></div>
    </section>
    <section id="cumulativePanel" class="panel feature-panel hidden">
      <div class="panel-head"><div><h3>领取累充</h3><p>累计进度仅统计网页商城实际消耗的平台币。</p></div><div class="cumulative-total">当前累计 <strong id="cumulativeTotal">0</strong></div></div>
      <div id="cumulativeRules"></div>
    </section>
    <section id="privilegePanel" class="panel feature-panel hidden">
      <div class="panel-head"><div><h3>特权卡</h3></div></div>
      <div class="feature-placeholder"><strong>暂无可用特权卡</strong><span>特权卡规则配置后会在这里展示购买、激活和权益状态。</span></div>
    </section>
  </section>
</div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let token=localStorage.getItem('cps_player_token')||'', me=null, busy=false, selectedCharacterId=0, mallProducts=[], selectedGiftId=0, cumulativeData={total_recharge:0,rules:[]};
const params=new URLSearchParams(location.search);
if(params.get('registered')==='1') $('#registeredNotice').classList.remove('hidden');
if(params.get('username')) $('#loginUser').value=params.get('username');
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function errorText(d){if(typeof d==='string')return d;if(Array.isArray(d))return d.map(x=>x.msg||'参数错误').join('；');return d?.message||d?.msg||'请求失败'}
async function api(path,options={}){const headers={'Content-Type':'application/json',...(options.headers||{})};if(token)headers.Authorization=`Bearer ${token}`;const r=await fetch(path,{...options,headers});let d={};try{d=await r.json()}catch{}if(r.status===401&&path!='/api/player/auth/login'){logout(false);throw new Error('登录已失效，请重新登录')}if(!r.ok)throw new Error(errorText(d.detail));return d}
function toast(text){const old=$('.toast');if(old)old.remove();const el=document.createElement('div');el.className='toast';el.textContent=text;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}
function logout(reload=true){token='';me=null;localStorage.removeItem('cps_player_token');$('#centerView').classList.add('hidden');$('#loginView').classList.remove('hidden');if(reload)location.replace('/player')}
function deliveryText(v){return ({waiting:'待发货',sent:'已发货',success:'成功',failed:'失败'})[v]||v||'-'}
function deliveryBadge(v){const c=['sent','success'].includes(v)?'ok':v==='failed'?'bad':'warn';return `<span class="badge ${c}">${esc(deliveryText(v))}</span>`}
function renderOverview(){const chars=me.characters||[];const role=chars.find(x=>x.is_primary)||chars[0];$('#overview').innerHTML=`<div class="stat coin"><span>平台币余额</span><strong>${Number(me.platform_coin_balance||0).toLocaleString()}</strong></div><div class="stat"><span>玩家账号</span><strong>${esc(me.username)}</strong></div><div class="stat"><span>玩家ID</span><strong>${esc(me.player_id)}</strong></div><div class="stat"><span>当前角色</span><strong>${role?esc(role.role_name):'未绑定'}</strong></div>`;const rb=$('#rechargeBalance');if(rb)rb.textContent=Number(me.platform_coin_balance||0).toLocaleString()}
function renderCharacterPicker(){const select=$('#purchaseCharacter');if(!select)return;const chars=me?.characters||[];if(!chars.length){selectedCharacterId=0;select.innerHTML='<option value="">未绑定角色</option>';select.disabled=true;return}if(!chars.some(x=>Number(x.id)===Number(selectedCharacterId))){const primary=chars.find(x=>x.is_primary)||chars[0];selectedCharacterId=Number(primary.id)}select.disabled=false;select.innerHTML=chars.map(x=>`<option value="${Number(x.id)}" ${Number(x.id)===Number(selectedCharacterId)?'selected':''}>${esc(x.server_name)} · ${esc(x.role_name)}${x.is_primary?'（主角色）':''}</option>`).join('');select.onchange=e=>{selectedCharacterId=Number(e.target.value||0)}}
function renderGiftDetail(){
  const select=$('#giftSelect'), detail=$('#giftDetail'), empty=$('#giftEmpty');
  if(!mallProducts.length){selectedGiftId=0;select.innerHTML='<option value="">暂无可购买礼包</option>';select.disabled=true;detail.classList.add('hidden');empty.classList.remove('hidden');return}
  empty.classList.add('hidden');select.disabled=false;
  if(selectedGiftId&&!mallProducts.some(x=>Number(x.id)===Number(selectedGiftId)))selectedGiftId=0;
  select.innerHTML='<option value="">请选择礼包</option>'+mallProducts.map(x=>`<option value="${Number(x.id)}" ${Number(x.id)===Number(selectedGiftId)?'selected':''}>${esc(x.name)} · ${Number(x.coin_price).toLocaleString()} 平台币</option>`).join('');
  const x=mallProducts.find(x=>Number(x.id)===Number(selectedGiftId));
  if(!x){detail.classList.add('hidden');return}
  detail.classList.remove('hidden');
  detail.innerHTML=`<div class="gift-detail-head"><div><h4>${esc(x.name)}</h4><div class="gift-sku">SKU：${esc(x.sku)}</div></div><div class="gift-price">平台币售价<strong>${Number(x.coin_price).toLocaleString()}</strong></div></div><div class="gift-content"><div class="gift-content-label">礼包内容</div><div class="gift-content-text">${esc(x.description||'暂无礼包内容')}</div></div><div class="gift-meta"><div class="stock">库存：${Number(x.stock).toLocaleString()}</div><div class="buy-area"><input id="giftQty" class="qty" type="number" min="1" max="99" value="1"><button id="giftBuyBtn" class="buy-btn" ${x.available?'':'disabled'}>${x.available?'购买':'已售罄'}</button></div></div>`;
  const btn=$('#giftBuyBtn');if(btn&&!btn.disabled)btn.onclick=()=>purchase(Number(x.id),btn);
}
async function loadProducts(){
  mallProducts=await api('/api/player/mall/products');
  renderGiftDetail();
  const select=$('#giftSelect');
  select.onchange=e=>{selectedGiftId=Number(e.target.value||0);renderGiftDetail()};
}
async function loadOrders(){const rows=await api('/api/player/mall/orders');const root=$('#orders');if(!rows.length){root.innerHTML='<div class="empty">暂无商城订单</div>';return}root.innerHTML=`<div class="table-wrap"><table><thead><tr><th>订单号</th><th>角色名</th><th>区服</th><th>礼包</th><th>数量</th><th>平台币</th><th>支付</th><th>发货</th><th>创建时间</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.order_no)}</td><td>${esc(x.role_name||'-')}</td><td>${esc(x.server_name||'-')}</td><td>${esc(x.product_name)}</td><td>${x.quantity}</td><td>${Number(x.coin_amount).toLocaleString()}</td><td><span class="badge ok">已支付</span></td><td>${deliveryBadge(x.delivery_status)}</td><td>${esc(x.created_at||'-')}</td></tr>`).join('')}</tbody></table></div>`}
function renderCumulative(){const root=$('#cumulativeRules'),total=$('#cumulativeTotal');if(total)total.textContent=Number(cumulativeData.total_recharge||0).toLocaleString();const rows=cumulativeData.rules||[];if(!rows.length){root.innerHTML='<div class="empty">暂无累充奖励</div>';return}root.innerHTML=`<div class="reward-list">${rows.map(x=>{const disabled=x.claimed||!x.eligible;const text=x.claimed?'已领取':x.eligible?'领取':'未达成';return `<div class="reward-card"><div class="reward-name"><strong>${esc(x.name)}</strong><span>门槛：${Number(x.threshold_amount||0).toLocaleString()} 平台币</span></div><div class="reward-content">${esc(x.reward_content||'-')}</div><button class="reward-action" data-rule-id="${Number(x.id)}" ${disabled?'disabled':''}>${text}</button></div>`}).join('')}</div>`;$$('.reward-action[data-rule-id]').forEach(btn=>btn.onclick=()=>claimCumulative(Number(btn.dataset.ruleId),btn))}
async function loadCumulative(){cumulativeData=await api('/api/player/cumulative-recharge');renderCumulative()}
async function claimCumulative(ruleId,btn){if(busy)return;busy=true;btn.disabled=true;btn.textContent='领取中…';try{const d=await api(`/api/player/cumulative-recharge/${ruleId}/claim`,{method:'POST'});toast(d.message||'领取成功');await loadCumulative()}catch(e){toast(e.message);await loadCumulative().catch(()=>{})}finally{busy=false}}
async function refreshAll(){me=await api('/api/player/me');renderOverview();renderCharacterPicker();await Promise.all([loadProducts(),loadOrders(),loadCumulative()])}
async function purchase(id,btn){if(busy)return;const product=mallProducts.find(x=>Number(x.id)===Number(id));if(!product)return toast('请先选择礼包');const qty=Number($('#giftQty')?.value||1);if(!Number.isInteger(qty)||qty<1)return toast('请输入正确购买数量');const chars=me?.characters||[];if(chars.length>1&&!selectedCharacterId)return toast('请先选择购买角色');const role=chars.find(x=>Number(x.id)===Number(selectedCharacterId));const roleText=role?`${role.server_name} · ${role.role_name}`:'未绑定角色';if(!confirm(`确认使用「${roleText}」购买 ${qty} 份「${product.name}」？需要 ${Number(product.coin_price)*qty} 平台币。`))return;busy=true;btn.disabled=true;btn.textContent='购买中…';try{const body={quantity:qty};if(selectedCharacterId)body.character_id=selectedCharacterId;const d=await api(`/api/player/mall/purchase/${id}`,{method:'POST',body:JSON.stringify(body)});toast(`${d.message}：${d.order_no}`);await refreshAll()}catch(e){toast(e.message)}finally{busy=false;const current=$('#giftBuyBtn');if(current){const selected=mallProducts.find(x=>Number(x.id)===Number(selectedGiftId));current.disabled=selected?!selected.available:false;current.textContent=selected?.available?'购买':'已售罄'}}}
$('#loginForm').onsubmit=async e=>{e.preventDefault();const btn=$('#loginBtn');$('#loginMsg').textContent='';btn.disabled=true;btn.textContent='登录中…';try{const d=await api('/api/player/auth/login',{method:'POST',body:JSON.stringify({username:$('#loginUser').value.trim(),password:$('#loginPass').value})});token=d.access_token;localStorage.setItem('cps_player_token',token);await enterCenter()}catch(err){$('#loginMsg').textContent=err.message;btn.disabled=false;btn.textContent='登录玩家中心'}};
async function enterCenter(){try{await refreshAll();$('#loginView').classList.add('hidden');$('#centerView').classList.remove('hidden');history.replaceState({},'',location.pathname)}catch(e){logout(false);$('#loginMsg').textContent=e.message}}
$$('.tab').forEach(btn=>btn.onclick=()=>{const tab=btn.dataset.tab;$$('.tab').forEach(x=>x.classList.toggle('active',x===btn));['recharge','mall','cumulative','privilege'].forEach(name=>$(`#${name}Panel`)?.classList.toggle('hidden',tab!==name));if(tab==='mall')Promise.all([loadProducts(),loadOrders()]).catch(e=>toast(e.message));if(tab==='cumulative')loadCumulative().catch(e=>toast(e.message))});
$('#logoutBtn').onclick=()=>logout(true);$('#refreshBtn').onclick=()=>refreshAll().then(()=>toast('已刷新')).catch(e=>toast(e.message));
if(token)enterCenter();
</script>
</body>
</html>
